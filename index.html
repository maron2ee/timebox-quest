<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 계획 — 타임박스 플래너</title>
<meta name="description" content="전업투자자를 위한 타임박스 플래너. 계획과 실행을 나란히 기록하고 공부 시간을 추적합니다.">
<meta name="theme-color" content="#f3f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">📋 하루 계획</div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="day">하루</button>
      <button class="tab" data-view="stats">통계</button>
      <button class="tab" data-view="archive">회고</button>
      <button class="tab" data-view="terms">용어</button>
      <button class="tab" data-view="research">리서치</button>
      <button class="tab" data-view="settings">설정</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ===================== 하루 계획 ===================== -->
  <section class="view active" id="view-day">

    <div class="statrow">
      <div class="card stat">
        <div class="datenav">
          <button class="nav-btn" id="dPrev" title="이전 날">‹</button>
          <div class="datenav-mid">
            <div class="datenav-y" id="dYear">—</div>
            <div class="datenav-d" id="dDate">—</div>
          </div>
          <button class="nav-btn" id="dNext" title="다음 날">›</button>
          <button class="today-chip" id="dToday">오늘</button>
        </div>
      </div>

      <div class="card stat" id="ddayCard" title="클릭해서 D-day 관리">
        <div class="stat-k" id="ddayLabel">D-day</div>
        <div class="stat-v" id="ddayValue">＋</div>
        <div class="stat-sub" id="ddaySub">눌러서 추가</div>
      </div>

      <div class="card stat">
        <div class="stat-k">학습시간</div>
        <div class="stat-v" id="studyVal">0분</div>
        <div class="stat-sub" id="studySub">계획 0분</div>
      </div>

      <div class="card stat">
        <div class="stat-k">Todo</div>
        <div class="stat-v" id="todoVal">0/0</div>
        <div class="segbar" id="todoSeg"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card goalbox">
        <div class="card-label">GOAL</div>
        <textarea class="ta" id="goalText" placeholder="오늘의 목표를 적어보세요&#10;- 장중엔 매매, 장후엔 공부"></textarea>
      </div>
      <div class="card big3box">
        <div class="card-label">BIG 3</div>
        <div id="big3List"></div>
      </div>
    </div>

    <div class="work">
      <aside class="card">
        <div class="panel-head">
          <div class="subtabs" id="taskTabs">
            <button class="subtab active" data-tab="study">📘 학습</button>
            <button class="subtab" data-tab="plan">🗓 일정</button>
          </div>
          <button class="icon-btn ml-auto" id="carryBtn" title="어제 미완료 할일 가져오기">↩</button>
        </div>
        <div class="groups" id="groupList"></div>
        <button class="add-group" id="addGroupBtn">＋ 그룹 추가</button>
      </aside>

      <div class="col-right">
        <section class="card">
          <div class="tl-head">
            <div class="palette" id="palette"></div>
            <div class="pomo ml-auto" id="pomoBox">
              <span class="pomo-time" id="pomoTime">25:00</span>
              <button class="btn sm" id="pomoToggle">🍅 집중</button>
            </div>
          </div>
          <div class="tl-legend" id="tlLegend"></div>
          <div class="tl-cols">
            <div class="tl-colname">PLAN</div>
            <button class="tl-copy" id="copyPlan" title="계획을 실행으로 복사">→</button>
            <div class="tl-colname">DONE</div>
          </div>
          <div class="tl-scalerow">
            <div class="tl-scale" id="scaleL"></div>
            <div></div>
            <div class="tl-scale" id="scaleR"></div>
          </div>
          <div class="tl-body" id="tlBody"></div>
          <div class="tl-foot" id="tlFoot"></div>
        </section>

        <section class="card card-pad">
          <div class="card-label">DAILY REVIEW</div>
          <div id="reviewList"></div>
        </section>
      </div>
    </div>
  </section>

  <!-- ===================== 통계 ===================== -->
  <section class="view" id="view-stats">
    <div class="statrow" id="statsCards"></div>
    <div class="card card-pad" style="margin-bottom:12px">
      <div class="row" style="margin-bottom:10px">
        <div class="card-title">기간별 추이</div>
        <div class="subtabs ml-auto" id="statsRange">
          <button class="subtab active" data-range="week">주간</button>
          <button class="subtab" data-range="month">월간</button>
        </div>
      </div>
      <div id="statsChart"></div>
    </div>
    <div class="grid2">
      <div class="card card-pad">
        <div class="card-label">카테고리별 시간</div>
        <div id="statsCats"></div>
      </div>
      <div class="card card-pad">
        <div class="card-label">계획 대비 실천율</div>
        <div id="statsAdh"></div>
      </div>
    </div>
  </section>

  <!-- ===================== 회고 아카이브 ===================== -->
  <section class="view" id="view-archive">
    <div class="card card-pad" style="margin-bottom:12px">
      <div class="row">
        <div class="card-title">회고 모아보기</div>
        <input class="inp ml-auto" id="archiveQ" placeholder="검색 (K/P/T · 목표)" style="max-width:260px">
      </div>
    </div>
    <div id="archiveList"></div>
  </section>

  <!-- ===================== 경제용어 노트 ===================== -->
  <section class="view" id="view-terms">
    <div class="card card-pad" style="margin-bottom:12px">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input class="inp" id="termWord" placeholder="용어 (예: 유상증자)" style="max-width:200px">
        <input class="inp" id="termMean" placeholder="뜻 — 내 말로 한 줄">
        <button class="btn primary" id="termAdd">추가</button>
      </div>
      <div class="row" style="margin-top:10px">
        <input class="inp" id="termQ" placeholder="검색" style="max-width:220px">
        <div class="subtabs ml-auto" id="termFilter">
          <button class="subtab active" data-f="all">전체</button>
          <button class="subtab" data-f="star">★ 복습</button>
        </div>
      </div>
    </div>
    <div id="termList"></div>
  </section>

  <!-- ===================== 종목 리서치 ===================== -->
  <section class="view" id="view-research">
    <div class="card card-pad" style="margin-bottom:12px">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input class="inp" id="rsTicker" placeholder="티커/코드" style="max-width:130px">
        <input class="inp" id="rsName" placeholder="종목명" style="max-width:190px">
        <button class="btn primary" id="rsAdd">새 메모</button>
        <input class="inp ml-auto" id="rsQ" placeholder="검색" style="max-width:220px">
      </div>
    </div>
    <div id="rsList"></div>
  </section>

  <!-- ===================== 설정 ===================== -->
  <section class="view" id="view-settings">
    <div class="card card-pad" style="margin-bottom:12px">
      <div class="card-title" style="margin-bottom:12px">타임라인</div>
      <div class="row" style="gap:12px;flex-wrap:wrap">
        <label class="row" style="gap:6px">시작 <input class="inp" id="setStart" type="number" min="0" max="23" style="width:74px"> 시</label>
        <label class="row" style="gap:6px">끝 <input class="inp" id="setEnd" type="number" min="1" max="24" style="width:74px"> 시</label>
        <label class="row" style="gap:6px">한 칸
          <select class="inp" id="setSlot" style="width:92px">
            <option value="10">10분</option><option value="15">15분</option><option value="30">30분</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card card-pad" style="margin-bottom:12px">
      <div class="row" style="margin-bottom:10px">
        <div class="card-title">장 시간 표시</div>
        <label class="row ml-auto" style="gap:6px;font-size:13px">
          <input type="checkbox" id="setMarket"> 타임라인에 표시
        </label>
      </div>
      <div id="marketRows"></div>
      <div class="stat-sub" style="margin-top:8px">2026.09.14부터 시간외단일가(16~18시)가 폐지되고 애프터마켓 16~20시가 신설됐어요.</div>
    </div>

    <div class="card card-pad" style="margin-bottom:12px">
      <div class="card-title" style="margin-bottom:12px">카테고리</div>
      <div id="catRows"></div>
      <button class="btn sm" id="catAdd" style="margin-top:8px">＋ 카테고리 추가</button>
    </div>

    <div class="card card-pad">
      <div class="card-title" style="margin-bottom:12px">데이터</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn" id="dataExport">내보내기 (JSON)</button>
        <button class="btn" id="dataImport">가져오기</button>
        <button class="btn" id="dataCsv">CSV 내보내기</button>
        <button class="btn ghost ml-auto" id="dataReset" style="color:var(--danger)">전체 초기화</button>
      </div>
      <div class="stat-sub" id="dataInfo" style="margin-top:10px"></div>
    </div>
  </section>

</main>

<!-- 블록 편집 모달 -->
<div class="modal-bg" id="blockModal" hidden>
  <div class="modal">
    <h3 id="blockModalTitle">시간 블록</h3>
    <input class="inp" id="blockTitle" placeholder="무엇을 했나요? (예: 반도체 섹터 리서치)">
    <div class="palette" id="blockPalette" style="margin-top:12px"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="blockDelete" style="color:var(--danger);margin-right:auto">삭제</button>
      <button class="btn" id="blockCancel">취소</button>
      <button class="btn primary" id="blockSave">저장</button>
    </div>
  </div>
</div>

<!-- D-day 모달 -->
<div class="modal-bg" id="ddayModal" hidden>
  <div class="modal">
    <h3>D-day</h3>
    <div id="ddayList" style="margin-bottom:12px"></div>
    <div class="row" style="gap:8px">
      <input class="inp" id="ddayName" placeholder="이름 (예: 실적발표)">
      <input class="inp" id="ddayDate" type="date" style="max-width:160px">
      <button class="btn primary" id="ddayAdd">추가</button>
    </div>
    <div class="modal-actions"><button class="btn" id="ddayClose">닫기</button></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/market.js"></script>
<script src="js/ui.js"></script>
<script src="js/timeline.js"></script>
<script src="js/tasks.js"></script>
<script src="js/pomodoro.js"></script>
<script src="js/day.js"></script>
<script src="js/stats.js"></script>
<script src="js/archive.js"></script>
<script src="js/terms.js"></script>
<script src="js/research.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
