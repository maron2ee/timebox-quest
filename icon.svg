<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2150"/>
      <stop offset="1" stop-color="#05071a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".55" stop-color="#f5aa08"/>
      <stop offset="1" stop-color="#e08e00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- sparkles -->
  <circle cx="98" cy="120" r="6" fill="#ffd21f"/>
  <circle cx="416" cy="150" r="7" fill="#ffd21f" opacity=".9"/>
  <circle cx="120" cy="410" r="5" fill="#ffd21f" opacity=".7"/>

  <!-- rising money arrow behind (growth) -->
  <g fill="none" stroke="#ffce3a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <polyline points="120,392 190,340 236,372 320,300"/>
  </g>
  <path d="M320 300 l-30 -2 12 22 z" fill="#ffce3a" opacity=".9"/>

  <!-- ears -->
  <circle cx="150" cy="180" r="46" fill="url(#gold)" stroke="#c8860a" stroke-width="8"/>
  <circle cx="150" cy="180" r="22" fill="#e39c1a"/>
  <circle cx="362" cy="180" r="46" fill="url(#gold)" stroke="#c8860a" stroke-width="8"/>
  <circle cx="362" cy="180" r="22" fill="#e39c1a"/>

  <!-- head -->
  <circle cx="256" cy="216" r="132" fill="url(#gold)" stroke="#c8860a" stroke-width="8"/>
  <ellipse cx="212" cy="176" rx="34" ry="24" fill="#fff" opacity=".28"/>

  <!-- heart face -->
  <path d="M256 202 C256 168 220 152 192 152 C148 152 126 186 126 218 C126 268 188 320 256 360 C324 320 386 268 386 218 C386 186 364 152 320 152 C292 152 256 168 256 202 Z" fill="#fff2c4" stroke="#eab308" stroke-width="4"/>

  <!-- cheeks -->
  <ellipse cx="178" cy="264" rx="20" ry="13" fill="#ff7eb0" opacity=".5"/>
  <ellipse cx="334" cy="264" rx="20" ry="13" fill="#ff7eb0" opacity=".5"/>

  <!-- eyes -->
  <ellipse cx="210" cy="222" rx="22" ry="27" fill="#2b2440"/>
  <ellipse cx="302" cy="222" rx="22" ry="27" fill="#2b2440"/>
  <circle cx="202" cy="212" r="8" fill="#fff"/>
  <circle cx="294" cy="212" r="8" fill="#fff"/>

  <!-- nose -->
  <ellipse cx="242" cy="284" rx="5" ry="7" fill="#8a6636"/>
  <ellipse cx="270" cy="284" rx="5" ry="7" fill="#8a6636"/>
  <path d="M228 300 q28 20 56 0" fill="none" stroke="#5a3d12" stroke-width="7" stroke-linecap="round"/>
</svg>
